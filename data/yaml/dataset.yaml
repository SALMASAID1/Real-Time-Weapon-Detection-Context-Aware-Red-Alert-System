# =============================================================================
# AWD&TA — Unified Dataset Configuration
# Sources: SOHAS (Univ. Granada) + Unidpro + Simuletic Synthetic
# Format: YOLOv11 / Ultralytics compatible
# =============================================================================

# --- Paths (relative to this file, or absolute) ---
path: ../../data/processed       # Root of the processed dataset
train: images/train
val:   images/val
test:  images/test

# --- Class Count ---
nc: 7

# --- Unified Class Ontology ---
# Decision rationale:
#   "handgun" and "pistol" merged → class 0 (visual overlap, same threat profile)
#   "rifle" covers all long-barrel firearms (AK, AR, shotgun mapped here)
#   "knife" covers bladed weapons <= 20cm
#   "machete" covers large bladed weapons / cleavers
#   "hand" is a parallel detection class for Hand-Weapon IoU proximity logic
#   "person" enables future person-centric threat radius analysis
#   All confuser / hard-negative images use empty label files (background class)
names:
  0: handgun
  1: rifle
  2: knife
  3: machete
  4: hand
  5: person
  6: weapon_generic   # catch-all for ambiguous/partially visible weapons

# --- Hyperparameter Hints (for training pipeline reference) ---
# imgsz: 640          # Tile size for SAHI; full-res handled by tiling pipeline
# overlap_ratio: 0.2  # SAHI tile overlap
# conf_threshold: 0.35
# iou_threshold: 0.45  # NMS and Hand-Weapon proximity threshold
